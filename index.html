<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi musculation</title>
<style>
:root {
  --bg: #f5f6f8;
  --card: rgba(255, 255, 255, 0.78);
  --card-border: rgba(255, 255, 255, 0.8);
  --ink: #111315;
  --mut: #6c757d;
  --acc: #111111;
  --line: rgba(0, 0, 0, 0.07);
  --bad: #e63946;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.04);
  --glass-blur: blur(16px);
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d0f12;
    --card: rgba(22, 26, 33, 0.75);
    --card-border: rgba(255, 255, 255, 0.08);
    --ink: #f1f3f5;
    --mut: #9ca3af;
    --acc: #ffffff;
    --line: rgba(255, 255, 255, 0.1);
    --bad: #ff6b6b;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
  }
}

:root[data-theme="dark"] {
  --bg: #0d0f12;
  --card: rgba(22, 26, 33, 0.75);
  --card-border: rgba(255, 255, 255, 0.08);
  --ink: #f1f3f5;
  --mut: #9ca3af;
  --acc: #ffffff;
  --line: rgba(255, 255, 255, 0.1);
  --bad: #ff6b6b;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: 'Batang', serif, system-ui, -apple-system, sans-serif;
  font-size: 15px;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

header {
  background: var(--card);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  color: var(--ink);
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--line);
  text-align: center;
  position: sticky;
  top: 0;
  z-index: 10;
}

header h1 {
  margin: 0;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

header p {
  margin: 4px 0 0;
  font-size: 12px;
  color: var(--mut);
}

nav {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  position: sticky;
  top: 61px;
  background: var(--bg);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  z-index: 9;
  max-width: 640px;
  margin: 0 auto;
}

nav button {
  flex: 1;
  padding: 11px 8px;
  border: 1px solid var(--line);
  background: var(--card);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  color: var(--mut);
  border-radius: 16px;
  font-weight: 600;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

nav button:hover {
  background: rgba(255, 255, 255, 0.9);
  transform: translateY(-1px);
  color: var(--ink);
}

nav button.on {
  background: linear-gradient(135deg, #23272d 0%, #000000 100%);
  color: #ffffff;
  border-color: transparent;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
}

main {
  max-width: 640px;
  margin: 0 auto;
  padding: 16px;
}

.card {
  background: var(--card);
  backdrop-filter: var(--glass-blur);
  -webkit-backdrop-filter: var(--glass-blur);
  border: 1px solid var(--card-border);
  border-radius: 22px;
  padding: 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  transition: transform 0.2s ease, box-shadow 0.2s ease;
}

.row {
  display: flex;
  gap: 10px;
  align-items: center;
}

.grow {
  flex: 1;
  min-width: 0;
}

input, select {
  font: inherit;
  color: var(--ink);
  background: rgba(255, 255, 255, 0.5);
  backdrop-filter: blur(4px);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  width: 100%;
  transition: all 0.2s ease;
}

@media (prefers-color-scheme: dark) {
  input, select {
    background: rgba(0, 0, 0, 0.2);
  }
}

input:focus, select:focus {
  outline: none;
  border-color: var(--ink);
  box-shadow: 0 0 0 3px rgba(0,0,0,0.05);
}

input[type=number] {
  text-align: center;
}

.btn {
  background: linear-gradient(135deg, #2b2e34 0%, #0f1012 100%);
  color: #fff;
  border: 0;
  border-radius: 14px;
  padding: 12px 18px;
  font-weight: 600;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,0,0,0.2);
}

.btn:active {
  transform: translateY(0);
}

.btn.ghost {
  background: rgba(255, 255, 255, 0.4);
  color: var(--ink);
  border: 1px solid var(--line);
  backdrop-filter: blur(4px);
  box-shadow: none;
}

.btn.ghost:hover {
  background: rgba(255, 255, 255, 0.85);
  border-color: var(--ink);
}

.btn.bad {
  background: transparent;
  color: var(--bad);
  border: 1px solid var(--bad);
  box-shadow: none;
}

.btn.bad:hover {
  background: var(--bad);
  color: #fff;
}

.btn.sm {
  padding: 8px 12px;
  font-size: 12px;
  border-radius: 10px;
}

.btn.full {
  width: 100%;
}

.x {
  background: none;
  border: 0;
  color: var(--bad);
  font-size: 18px;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 8px;
  transition: background 0.2s;
}

.x:hover {
  background: rgba(230, 57, 70, 0.1);
}

h2 {
  margin: 0 0 8px;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.3px;
}

.hint {
  color: var(--mut);
  font-size: 12px;
  margin: 4px 0 10px;
  line-height: 1.4;
}

.set {
  display: grid;
  grid-template-columns: 28px 1fr 1fr 60px 32px;
  gap: 6px;
  align-items: center;
  margin-bottom: 6px;
}

.sw {
  margin-bottom: 12px;
  background: rgba(0,0,0,0.02);
  padding: 8px 10px;
  border-radius: 14px;
  border: 1px solid rgba(0,0,0,0.03);
}

.sw .setn {
  font-size: 12px;
  padding: 8px 10px;
  margin-top: 4px;
}

.thumb {
  width: 50px;
  height: 50px;
  object-fit: cover;
  border-radius: 12px;
  border: 1px solid var(--line);
  cursor: pointer;
  flex: none;
  box-shadow: 0 2px 8px rgba(0,0,0,0.06);
}

.thumb.sm {
  width: 36px;
  height: 36px;
  border-radius: 10px;
}

.cam {
  color: var(--ink);
  font-size: 16px;
}

.set b {
  color: var(--mut);
  text-align: center;
  font-size: 13px;
  font-weight: 600;
}

.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 14px;
}

.stat {
  background: rgba(255, 255, 255, 0.45);
  backdrop-filter: blur(8px);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px 8px;
  text-align: center;
  transition: transform 0.2s ease;
}

.stat:hover {
  transform: translateY(-2px);
}

.stat b {
  display: block;
  font-size: 18px;
  color: var(--ink);
  font-weight: 700;
}

.stat span {
  font-size: 11px;
  color: var(--mut);
}

.empty {
  color: var(--mut);
  text-align: center;
  padding: 24px 12px;
  font-style: italic;
}

details {
  border-top: 1px solid var(--line);
  padding: 10px 0;
}

summary {
  cursor: pointer;
  font-weight: 600;
  padding: 4px 0;
}

.ex {
  font-size: 13px;
  color: var(--mut);
  margin: 6px 0;
  padding-left: 10px;
  border-left: 2px solid var(--line);
}

svg {
  width: 100%;
  height: auto;
  display: block;
}

.lbl {
  display: block;
  font-size: 12px;
  color: var(--mut);
  margin: 0 0 6px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
</style>
</head>
<body>
<header>
  <h1>💪 Mon suivi muscu</h1>
  <p id="sync">Chargement…</p>
</header>

<nav id="nav"></nav>
<main id="app"></main>

<datalist id="exlist"></datalist>
<datalist id="notelist">
  <option value="Dropset">
  <option value="Échec">
  <option value="Dur">
  <option value="Facile">
  <option value="Tempo lent">
  <option value="Superset">
  <option value="Échauffement">
</datalist>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const fmtD=d=>new Date(d+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'short'});
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isNaN(n)?0:n};

let prog={seances:[]},sessions=[],draft=null,tab='seance',selEx='',col=null,armed='',tmr,imgs={},assets=null;
const blank=()=>({w:'',r:'',p:'',n:''});
const ik=n=>String(n||'').trim().toLowerCase();
const fmtSet=x=>x.w+'×'+x.r+(x.p?' @'+x.p:'')+(x.n?' ('+esc(x.n)+')':'');
const thumb=(n,sm)=>imgs[ik(n)]?`<img class="thumb ${sm?'sm':''}" data-act="zoom" src="${imgs[ik(n)].indexOf('data:')===0?imgs[ik(n)]:'/_blob/'+imgs[ik(n)]}" alt="">`:'';
const cam=(n,rm)=>`<button class="x cam" data-act="img" data-n="${esc(n)}" title="Photo">📷</button>`+(rm&&imgs[ik(n)]?`<button class="x" data-act="rmimg" data-n="${esc(n)}" title="Retirer la photo">🗑️</button>`:'');
const b2d=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});

async function shrink(f){
  const bm=await createImageBitmap(f),s=Math.min(1,(col&&assets?800:480)/Math.max(bm.width,bm.height)),c=document.createElement('canvas');
  c.width=Math.round(bm.width*s);c.height=Math.round(bm.height*s);
  c.getContext('2d').drawImage(bm,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
}

function pickImg(n){
  if(!ik(n)){alert('Donne d’abord un nom à l’exercice.');return}
  const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=async()=>{
    const f=i.files[0];if(!f)return;
    try{
      const blob=await shrink(f);
      if(assets&&col){
        const r=await assets.upload(blob);
        const old=imgs[ik(n)];imgs[ik(n)]=r.id;
        await col.doc('images').set({map:imgs});
        if(old&&old.indexOf('data:')!==0)assets.delete(old).catch(()=>{});
      }else{
        imgs[ik(n)]=await b2d(blob);lsSave();
      }
      render();
    }catch(e){alert('Impossible d’ajouter la photo.');}
  };
  i.click();
}

async function rmImg(n){
  const old=imgs[ik(n)];delete imgs[ik(n)];
  try{
    if(col){
      await col.doc('images').set({map:imgs});
      if(old&&old.indexOf('data:')!==0&&assets)assets.delete(old).catch(()=>{});
    }else lsSave();
  }catch(e){}
  render();
}

/* ---------- stockage ---------- */
function lsLoad(){try{const o=JSON.parse(localStorage.getItem('muscu')||'{}');prog=o.prog||{seances:[]};sessions=o.sessions||[];imgs=o.imgs||{}}catch(e){}}
function lsSave(){try{localStorage.setItem('muscu',JSON.stringify({prog,sessions,imgs}))}catch(e){}}
const sortS=()=>sessions.sort((a,b)=>b.date.localeCompare(a.date)||b.ts-a.ts);
function saveProg(){clearTimeout(tmr);tmr=setTimeout(()=>{if(col)col.doc('programme').set(prog).catch(console.error);else lsSave()},500)}
function saveSession(s){if(col)return col.doc('s_'+s.id).set(s);sessions.push(s);sortS();lsSave();render()}
function delSession(id){if(col)return col.doc('s_'+id).delete();sessions=sessions.filter(s=>s.id!==id);lsSave();render()}

/* ---------- données ---------- */
function lastSets(name){const n=name.toLowerCase();for(const s of sessions){const e=s.ex.find(x=>x.name.toLowerCase()===n);if(e&&e.sets.length)return e.sets}return null}
function exNames(){const set=new Set();prog.seances.forEach(s=>s.exercises.forEach(e=>e.name&&set.add(e.name)));sessions.forEach(s=>s.ex.forEach(e=>set.add(e.name)));return[...set].sort((a,b)=>a.localeCompare(b))}
function newDraft(sid){
  const s=prog.seances.find(x=>x.id===sid);
  draft={sid:sid||'',name:s?s.name:'Séance libre',date:today(),ex:(s?s.exercises:[]).map(e=>({name:e.name,target:e.reps,sets:Array.from({length:Math.max(1,+e.sets||3)},()=>blank())}))};
}
const vol=s=>s.ex.reduce((a,e)=>a+e.sets.reduce((b,x)=>b+x.w*x.r,0),0);

/* ---------- rendu ---------- */
function render(){
  const tabIcons={seance:'🏋️‍♂️', prog:'📋', suivi:'📈'};
  $('#nav').innerHTML=[['seance','Séance'],['prog','Programme'],['suivi','Progression']].map(([k,l])=>`<button data-act="tab" data-v="${k}" class="${tab===k?'on':''}">${tabIcons[k]} ${l}</button>`).join('');
  $('#exlist').innerHTML=exNames().map(n=>`<option value="${esc(n)}">`).join('');
  $('#app').innerHTML=(tab==='seance'?vSeance():tab==='prog'?vProg():vSuivi())+(tab==='seance'?'':vData());
}

function vSeance(){
  if(!draft)newDraft('');
  const opts=['<option value="">Séance libre</option>'].concat(prog.seances.map(s=>`<option value="${s.id}" ${s.id===draft.sid?'selected':''}>${esc(s.name)}</option>`)).join('');
  let h=`<div class="card"><div class="row"><div class="grow"><span class="lbl">Séance</span><select data-act="pick">${opts}</select></div><div class="grow"><span class="lbl">Date</span><input type="date" value="${draft.date}" data-d="date"></div></div></div>`;
  
  draft.ex.forEach((e,i)=>{
    const last=lastSets(e.name);
    h+=`<div class="card"><div class="row">${thumb(e.name)}<h2 class="grow">${esc(e.name)}</h2>${cam(e.name)}<button class="x" data-act="rmex" data-i="${i}" title="Retirer">✕</button></div>
    <div class="hint">${e.target?'Target : '+esc(e.target)+' reps · ':''}${last?'Dernière fois : '+last.map(fmtSet).join(', '):'Aucun historique'}</div>`;
    
    e.sets.forEach((s,j)=>{
      const l=last&&last[j];
      h+=`<div class="sw"><div class="set"><b>#${j+1}</b><input type="number" inputmode="decimal" placeholder="${l?l.w:'kg'}" value="${esc(s.w)}" data-k="w" data-i="${i}" data-j="${j}"><input type="number" inputmode="numeric" placeholder="${l?l.r:'reps'}" value="${esc(s.r)}" data-k="r" data-i="${i}" data-j="${j}"><input type="number" inputmode="decimal" step="0.5" min="1" max="10" placeholder="RPE" value="${esc(s.p)}" data-k="p" data-i="${i}" data-j="${j}"><button class="x" data-act="rmset" data-i="${i}" data-j="${j}">✕</button></div><input class="setn" list="notelist" placeholder="Note (ex: Dropset, Échec...)" value="${esc(s.n)}" data-k="n" data-i="${i}" data-j="${j}"></div>`;
    });
    
    h+=`<button class="btn ghost sm" data-act="addset" data-i="${i}">➕ Ajouter une série</button></div>`;
  });
  
  h+=`<div class="card"><div class="row"><input class="grow" id="newex" list="exlist" placeholder="Exercice (ex. Développé couché)"><button class="btn sm" data-act="addex">➕ Ajouter</button></div></div>
  <button class="btn full" data-act="save">💾 Enregistrer la séance</button>`;
  return h;
}

function vProg(){
  let h=`<p class="hint" style="text-align:center;margin-bottom:16px;">Configure tes séances types (Push, Pull, Legs...).</p>`;
  prog.seances.forEach((s,i)=>{
    h+=`<div class="card"><div class="row"><input class="grow" value="${esc(s.name)}" data-p="sn" data-s="${i}" placeholder="Nom de la séance"><button class="btn bad sm" data-act="delseance" data-s="${i}">${armed==='s'+i?'Confirmer ?':'🗑️ Supprimer'}</button></div><div style="height:12px"></div>`;
    s.exercises.forEach((e,j)=>{
      h+=`<div class="row" style="margin-bottom:8px">${thumb(e.name,1)}<input class="grow" list="exlist" value="${esc(e.name)}" data-p="en" data-s="${i}" data-e="${j}" placeholder="Exercice" style="flex:3"><input type="number" value="${esc(e.sets)}" data-p="es" data-s="${i}" data-e="${j}" style="flex:1" title="Séries"><input value="${esc(e.reps)}" data-p="er" data-s="${i}" data-e="${j}" placeholder="reps" style="flex:1;text-align:center">${cam(e.name)}<button class="x" data-act="rmprogex" data-s="${i}" data-e="${j}">✕</button></div>`;
    });
    h+=`<div class="hint">Colonnes : exercice · séries · reps (ex. 8-10)</div><button class="btn ghost sm" data-act="addprogex" data-s="${i}">➕ Exercice</button></div>`;
  });
  h+=`<button class="btn full" data-act="addseance">➕ Créer une nouvelle séance</button>`;
  return h;
}

function vSuivi(){
  const now=new Date(),ym=now.getFullYear()+'-'+pad(now.getMonth()+1);
  const mo=sessions.filter(s=>s.date.startsWith(ym));
  let h=`<div class="stats"><div class="stat"><b>${mo.length}</b><span>séances / mois</span></div><div class="stat"><b>${Math.round(mo.reduce((a,s)=>a+vol(s),0)).toLocaleString('fr-FR')}</b><span>kg ce mois</span></div><div class="stat"><b>${sessions.length}</b><span>séances au total</span></div></div>`;
  
  const names=exNames().filter(n=>sessions.some(s=>s.ex.some(e=>e.name===n)));
  if(!names.length)return h+`<div class="card empty">Enregistre une première séance pour débloquer tes statistiques.</div>`;
  
  if(!names.includes(selEx))selEx=names[0];
  const pts=sessions.filter(s=>s.ex.some(e=>e.name===selEx)).slice().reverse().map(s=>{
    const sets=s.ex.find(e=>e.name===selEx).sets.filter(x=>x.r>0);
    return{d:s.date,w:Math.max(0,...sets.map(x=>x.w)),rm:Math.max(0,...sets.map(x=>x.w*(1+x.r/30)))};
  });
  
  const rec=Math.max(...pts.map(p=>p.w)),rm=Math.max(...pts.map(p=>p.rm));
  h+=`<div class="card"><span class="lbl">Sélectionner un exercice</span><select data-act="selex">${names.map(n=>`<option ${n===selEx?'selected':''} value="${esc(n)}">${esc(n)}</option>`).join('')}</select>
  ${true?`<div class="row" style="margin-top:12px">${thumb(selEx)}${cam(selEx,1)}</div>`:''}<div class="stats" style="margin:14px 0 0"><div class="stat"><b>${rec} kg</b><span>charge max</span></div><div class="stat"><b>${Math.round(rm*10)/10} kg</b><span>1RM estimé</span></div><div class="stat"><b>${pts.length}</b><span>sessions</span></div></div>${chart(pts)}</div>`;
  
  h+=`<div class="card"><h2>Historique des séances</h2>`+sessions.map(s=>`<details><summary>${fmtD(s.date)} · ${esc(s.name)} <span class="hint">(${Math.round(vol(s)).toLocaleString('fr-FR')} kg)</span></summary>${s.ex.map(e=>`<div class="ex"><b>${esc(e.name)}</b> : ${e.sets.map(fmtSet).join(' · ')}</div>`).join('')}<button class="btn bad sm" style="margin-top:8px;" data-act="delsess" data-id="${s.id}">${armed===s.id?'Confirmer la suppression ?':'🗑️ Supprimer'}</button></details>`).join('')+`</div>`;
  return h;
}

function chart(p){
  if(p.length<2)return`<p class="hint">Enregistre au moins deux séances avec cet exercice pour afficher la courbe d'évolution.</p>`;
  const W=340,H=150,m=30,mx=Math.max(...p.map(a=>a.w)),mn=Math.min(...p.map(a=>a.w)),rg=(mx-mn)||1;
  const X=i=>m+i*(W-2*m)/(p.length-1),Y=v=>H-m-(v-mn)*(H-2*m)/rg;
  const pts=p.map((a,i)=>X(i)+','+Y(a.w)).join(' ');
  const areaPts=`${X(0)},${H-m} ${pts} ${X(p.length-1)},${H-m}`;
  
  return`<svg viewBox="0 0 ${W} ${H}" style="margin-top:14px">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--ink)" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="var(--ink)" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <line x1="${m}" y1="${H-m}" x2="${W-m}" y2="${H-m}" stroke="var(--line)" stroke-width="1"/>
  <line x1="${m}" y1="${m}" x2="${W-m}" y2="${m}" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 3"/>
  <polygon points="${areaPts}" fill="url(#grad)"/>
  <polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  ${p.map((a,i)=>`<circle cx="${X(i)}" cy="${Y(a.w)}" r="4" fill="var(--bg)" stroke="var(--ink)" stroke-width="2.5"/>`).join('')}
  <text x="4" y="${Y(mx)+4}" font-size="10" fill="var(--mut)" font-family="sans-serif">${mx}kg</text>
  <text x="4" y="${Y(mn)+4}" font-size="10" fill="var(--mut)" font-family="sans-serif">${mn}kg</text>
  <text x="${m}" y="${H-8}" font-size="10" fill="var(--mut)" font-family="sans-serif">${fmtD(p[0].d)}</text>
  <text x="${W-m}" y="${H-8}" font-size="10" text-anchor="end" fill="var(--mut)" font-family="sans-serif">${fmtD(p[p.length-1].d)}</text>
  </svg>`;
}

function vData(){
  return`<div class="card"><h2>⚙️ Sauvegarde et Données</h2><div class="hint">Export de secours de ton programme, tes séances et tes photos.</div><div class="row" style="margin-top:10px"><button class="btn sm grow" data-act="backup">📥 Sauvegarder</button><button class="btn ghost sm grow" data-act="restore">📤 Restaurer</button></div></div>`;
}

async function backup(){
  const name='suivi-muscu-'+today()+'.json',txt=JSON.stringify({v:1,prog,sessions,imgs});
  try{const dl=await claude.use('downloads');if(dl){await dl.save({filename:name,data:txt});return}}catch(e){}
  const file=new File([txt],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:name});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();a.remove();
}

function restore(){
  const i=document.createElement('input');i.type='file';i.accept='.json,application/json';
  i.onchange=async()=>{
    const f=i.files[0];if(!f)return;
    try{
      const o=JSON.parse(await f.text());
      if(!o||!Array.isArray(o.sessions)||!o.prog||!Array.isArray(o.prog.seances))throw 0;
      const have=new Set(sessions.map(s=>s.id)),add=o.sessions.filter(s=>s&&s.id&&!have.has(s.id)&&Array.isArray(s.ex));
      const ids=new Set(prog.seances.map(s=>s.id));o.prog.seances.forEach(s=>{if(!ids.has(s.id))prog.seances.push(s)});
      if(col){
        await col.doc('programme').set(prog);
        for(const s of add)await col.doc('s_'+s.id).set(s);
      }else{
        sessions=sessions.concat(add);sortS();
        Object.entries(o.imgs||{}).forEach(([k,v])=>{if(typeof v==='string'&&v.indexOf('data:')===0&&!imgs[k])imgs[k]=v});
        lsSave();
      }
      render();
      alert(add.length+' séance(s) restaurée(s).');
    }catch(e){alert('Fichier de sauvegarde invalide.');}
  };
  i.click();
}

/* ---------- événements ---------- */
const A=$('#app');

document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.k){draft.ex[+d.i].sets[+d.j][d.k]=t.value;return}
  if(d.d){draft[d.d]=t.value;return}
  if(d.p){
    const s=prog.seances[+d.s];
    if(d.p==='sn')s.name=t.value;
    else{const x=s.exercises[+d.e];if(d.p==='en')x.name=t.value;if(d.p==='es')x.sets=t.value;if(d.p==='er')x.reps=t.value}
    saveProg();
  }
});

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const d=b.dataset,a=d.act;
  if(a==='pick'||a==='selex')return;
  if(a==='zoom'){
    const o=document.createElement('div');
    o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;display:flex;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(8px)';
    o.innerHTML='<img src="'+b.src+'" style="max-width:100%;max-height:100%;border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,0.5)">';
    o.onclick=()=>o.remove();
    document.body.appendChild(o);
    return;
  }
  if(a==='img'){pickImg(d.n);return}
  if(a==='backup'){backup();return}
  if(a==='restore'){restore();return}
  if(a==='rmimg'){rmImg(d.n);return}
  
  const arm=k=>{if(armed===k)return true;armed=k;render();setTimeout(()=>{if(armed===k){armed='';render()}},3000);return false};
  
  if(a==='tab'){tab=d.v;armed=''}
  else if(a==='addset'){draft.ex[+d.i].sets.push(blank())}
  else if(a==='rmset'){const s=draft.ex[+d.i].sets;if(s.length>1)s.splice(+d.j,1)}
  else if(a==='rmex'){draft.ex.splice(+d.i,1)}
  else if(a==='addex'){const n=$('#newex').value.trim();if(!n)return;draft.ex.push({name:n,sets:[blank(),blank(),blank()]})}
  else if(a==='save'){
    const ex=draft.ex.map(x=>({name:x.name,sets:x.sets.map(s=>({w:num(s.w),r:Math.round(num(s.r)),p:num(s.p),n:String(s.n||'').trim()})).filter(s=>s.r>0)})).filter(x=>x.sets.length);
    if(!ex.length){alert('Ajoute au moins une série avec des répétitions.');return}
    const s={id:gid(),ts:Date.now(),date:draft.date||today(),name:draft.name,ex};
    Promise.resolve(saveSession(s)).then(()=>{draft=null;tab='suivi';render()}).catch(()=>alert('Enregistrement impossible, réessaie.'));
    return;
  }
  else if(a==='addseance'){prog.seances.push({id:gid(),name:'Séance '+(prog.seances.length+1),exercises:[]});saveProg()}
  else if(a==='delseance'){if(!arm('s'+d.s))return;prog.seances.splice(+d.s,1);armed='';saveProg()}
  else if(a==='addprogex'){prog.seances[+d.s].exercises.push({name:'',sets:3,reps:'8-10'});saveProg()}
  else if(a==='rmprogex'){prog.seances[+d.s].exercises.splice(+d.e,1);saveProg()}
  else if(a==='delsess'){if(!arm(d.id))return;armed='';Promise.resolve(delSession(d.id)).then(render);return}
  render();
});

document.addEventListener('change',e=>{
  const t=e.target,a=t.dataset.act;
  if(a==='pick'){newDraft(t.value);render()}
  if(a==='selex'){selEx=t.value;render()}
  if(t.dataset.p==='en')render();
});

/* ---------- démarrage ---------- */
(async function(){
  render();
  let ok=false;
  try{
    const db=await claude.use('db'),user=await claude.use('user');assets=await claude.use('assets').catch(()=>null);
    if(db&&user){
      const id=await user.id();
      if(id){
        col=db.collection('data/users/'+id);ok=true;
        col.onSnapshot(snap=>{
          sessions=[];
          snap.docs.forEach(d=>{
            const x=d.data();if(!x)return;
            if(d.id==='programme')prog=x.seances?x:{seances:[]};
            else if(d.id==='images')imgs=x.map||{};
            else if(d.id.indexOf('s_')===0)sessions.push(x);
          });
          sortS();
          const f=document.activeElement;
          if(!(f&&/INPUT|SELECT/.test(f.tagName)))render();
        },()=>{});
      }
    }
  }catch(e){}
  
  if(!ok){lsLoad();sortS()}
  render();
  $('#sync').textContent=ok?'Tes données sont enregistrées sur ton compte':'Mode local : données gardées sur cet appareil';
})();
</script>
</body>
